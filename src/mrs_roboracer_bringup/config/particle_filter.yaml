# f1tenth/particle_filter parameters (upstream config/localize.yaml, minus its
# map_server section: localization_launch.py serves the map from map:=).
particle_filter:
  ros__parameters:
    # topic names (f1tenth_stack: /scan from urg_node, /odom from vesc_to_odom)
    scan_topic: '/scan'
    odometry_topic: '/odom'
    # range data downsampling
    angle_step: 18
    max_particles: 4000
    squash_factor: 2.2
    # visualization
    viz: 1
    max_viz_particles: 60
    # ray marching method: 'rmgpu' needs range_libc built with
    # compile_with_cuda.sh (the car); use 'rm' or 'cddt' without CUDA.
    range_method: 'rmgpu'
    theta_discretization: 112
    # range data filtering
    max_range: 10
    fine_timing: 0
    # publishes /pf/pose/odom, the onboard `pose` topic in modes.py
    publish_odom: 1
    # sensor model constants
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    # sensor model variant, variant 2 good for rmgpu, 3 doesn't work for rmgpu
    rangelib_variant: 2
